<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>미사일 테트리스</title>
<style>
  :root { --bg:#0b1220; --panel:#111827; --line:#1f2937; --fg:#e5e7eb; --muted:#9ca3af;
          --violet:#8a38f5; --pink:#ec4899; --orange:#fb923c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
       /* 폰에서 버튼을 꾹 누르면 글자·아이콘이 선택되고 복사 메뉴가 뜬다 — 게임 화면에선 전부 막는다 */
       -webkit-user-select: none; -moz-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font-family:Pretendard,-apple-system,"Segoe UI",sans-serif; overflow-x:hidden; }
  .wrap { display:flex; gap:18px; align-items:flex-start; padding:18px; }
  canvas { background:#0f172a; border:2px solid var(--line); border-radius:12px; display:block; touch-action:none; }
  .side { width:180px; display:flex; flex-direction:column; gap:10px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 13px; }
  .card h2 { margin:0 0 5px; font-size:11px; color:var(--muted); font-weight:600; letter-spacing:.4px; }
  .big { font-size:23px; font-weight:800; line-height:1.1; }
  .keys { font-size:11.5px; color:var(--muted); line-height:1.85; }
  .keys b { color:var(--fg); }
  .ammo-row { display:flex; gap:10px; align-items:center; }
  .ammo-row .one { flex:1 1 0; }
  .m1 { color:var(--orange); font-weight:800; }
  .m2 { color:#f43f5e; font-weight:800; }
  button { width:100%; padding:9px; border:0; border-radius:9px; cursor:pointer; font-weight:700; color:#fff;
           background:linear-gradient(90deg,var(--violet),var(--pink)); font-family:inherit; font-size:14px; }
  button.ghost { background:#1f2937; border:1px solid var(--line); }
  /* 판 위에 떠 있는 상단 표시 — 좁은 화면에서 자리를 차지하지 않게 absolute */
  .stage { position:relative; display:inline-block; line-height:0; }
  .hud { position:absolute; left:6px; right:6px; top:6px; display:none; align-items:flex-start;
         justify-content:space-between; gap:8px; z-index:3; pointer-events:none; line-height:1.25; }
  .hud .l { background:rgba(11,18,32,.72); border:1px solid var(--line); border-radius:9px; padding:4px 9px; }
  .hud .l { display:flex; align-items:center; gap:9px; }        /* 점수 옆에 '다음 블록' 미리보기 */
  .hud .l .ln { line-height:1.2; }
  .hud .l canvas { width:56px; height:34px; opacity:.95; }
  .hud .l b { font-size:19px; font-weight:800; }
  .hud .l span { font-size:11px; color:var(--muted); margin-left:6px; }
  .hud .r { display:flex; gap:6px; pointer-events:auto; }
  .hud .r button { width:auto; padding:6px 10px; font-size:12px; border-radius:9px; }
  .pad button span { font-size:12px; margin-left:3px; opacity:.9; }
  .pad { display:none; gap:7px; margin:7px auto 0; }
  .pad button { flex:1 1 0; padding:15px 0; font-size:19px; background:#1f2937; border:1px solid var(--line); }
  .pad button.f1 { background:linear-gradient(90deg,#f97316,#f59e0b); }
  .pad button.f2 { background:linear-gradient(90deg,#e11d48,#f43f5e); }
  .pad button.w2 { flex: 2 1 0; }        /* 좌·우 두 개를 합친 폭 */
  .over { position:fixed; inset:0; display:none; place-items:center; background:rgba(2,6,23,.86); z-index:9; }
  .over.on { display:grid; }
  /* 첫 탭 전까지 덮는 시작 화면 — 브라우저는 사용자가 한 번 눌러야 소리를 내준다 */
  .start { position:fixed; inset:0; display:grid; place-items:center; z-index:12; background:rgba(2,6,23,.9); }
  .start.off { display:none; }
  .start .b { text-align:center; }
  .start h1 { margin:0 0 6px; font-size:26px; }
  .start p { color:var(--muted); margin:0 0 16px; font-size:13px; line-height:1.7; }
  .start button { width:220px; padding:14px; font-size:16px; }
  .ver { position:fixed; right:6px; bottom:4px; font-size:10px; color:#334155; z-index:20; }
  .over div { text-align:center; }
  .over h1 { margin:0 0 6px; font-size:30px; }
  .over p { color:var(--muted); margin:0 0 14px; }
  @media (max-width: 760px), (pointer: coarse) {
    body { display:block; overflow:hidden; }
    .wrap { flex-direction:column; align-items:center; gap:0; padding:4px 4px 0; }
    /* 판 높이를 화면에서 버튼 두 줄만큼 뺀 값으로 — 스크롤 없이 한 화면에 들어온다 */
    canvas#cv { height:calc(100dvh - 130px); width:auto; max-width:96vw; }
    .side { display:none; }                 /* 옆 패널(점수·다음·키안내·미사일)은 통째로 숨김 */
    .hud { display:flex; }
    .pad { display:flex; width:min(96vw, 52vh); }
    .pad button { padding:13px 0; font-size:17px; }
  }
</style></head><body>
<div class="wrap">
  <div class="stage">
    <canvas id="cv" width="300" height="600"></canvas>
    <div class="hud">
      <div class="l"><div class="ln"><b id="hScore">0</b><span><span id="hLines">0</span>줄 · Lv<span id="hLevel">1</span></span></div><canvas id="hNx" width="56" height="34" title="다음 블록"></canvas></div>
      <div class="r"><button id="bgmBtn" class="ghost">♪ 배경음</button><button id="againM">새 게임</button><button id="muteM" class="ghost">🔊</button></div>
    </div>
  </div>
  <div class="side">
    <div class="card"><h2>점수</h2><div class="big" id="score">0</div></div>
    <div class="card"><h2>줄 / 레벨</h2><div class="big"><span id="lines">0</span> <span style="color:var(--muted);font-size:15px">/ Lv<span id="level">1</span></span></div></div>
    <div class="card hide-m"><h2>다음</h2><canvas id="nx" width="130" height="92"></canvas></div>
    <div class="card"><h2>미사일</h2>
      <div class="ammo-row">
        <div class="one"><span class="m1">🚀 <span id="ammo1">0</span></span></div>
        <div class="one"><span class="m2">💥 <span id="ammo2">0</span></span></div>
      </div>
    </div>
    <div class="card keys hide-m">
      <b>← →</b> 이동 · <b>↑</b> 회전<br><b>↓</b> 빠르게 내리기<br><b>Space</b> 즉시 낙하<br>
      <b class="m1">F</b> 미사일 · <b class="m2">G</b> 대형미사일<br><b>P</b> 일시정지 · <b>M</b> 소리
    </div>
    <button id="again">새 게임</button>
    <button id="mute" class="ghost">🔊 소리 켜짐</button>
    <button id="bgmBtn2" class="ghost">♪ 배경음 바꾸기</button>
  </div>
</div>
<div class="pad">
  <button id="bBoom" class="f2">💥<span id="a2">1</span></button>
  <button id="bFire" class="f1">🚀<span id="a1">3</span></button>
  <button id="bRot">⟳</button><button id="bUndo">↩<span id="au">3</span></button>
</div>
<div class="pad">
  <button id="bDrop" class="w2">⤓</button>
  <button id="bL">◀</button><button id="bR">▶</button>
</div>
<div class="start" id="start"><div class="b">
  <h1>미사일 테트리스</h1>
  <p>◆ 든 줄을 지우면 🚀 · ★ 든 줄을 지우면 💥<br>아래로 쏴서 막힌 자리를 뚫으세요<br><b>소리와 배경음이 함께 켜집니다</b></p>
  <button id="startBtn">▶ 탭해서 시작</button>
</div></div>
<div class="ver">v10</div>
<div class="over" id="over"><div>
  <h1>게임 오버</h1><p id="final"></p>
  <button id="restart" style="width:180px;margin:0 auto">다시 하기</button>
</div></div>
<script>
/* ─────────── 판 크기 ─────────── */
const COLS = 10, ROWS = 20, CELL = 30;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const nx = document.getElementById('nx'), nctx = nx.getContext('2d');

/* ─────────── 소리 — 파일 없이 WebAudio 로 직접 만든다 (단일 파일 유지) ───────────
   브라우저는 사용자가 한 번 건드리기 전엔 소리를 못 내므로, 첫 조작 때 깨운다. */
const Snd = {
  ctx: null, on: true, master: null, musicOn: false, timer: null, step: 0, nextAt: 0,
  init() {
    // 곡 파일도 첫 조작 때 같이 깨운다 — 브라우저가 자동재생을 막아 시작이 안 되던 것
    if (typeof bgmEl !== 'undefined' && bgmEl && this.on && bgmEl.paused) bgmEl.play().catch(() => {});
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { this.on = false; return; }
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.9;
    this.master.connect(this.ctx.destination);
    this.startMusic();
  },
  tone(freq, dur, type, gain, slideTo) {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain || 0.18, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, gain, cutoff, sweepTo) {       // 폭발음 — 화이트노이즈를 필터로 깎아 쓴다
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime, n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(cutoff || 1200, t);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(Math.max(60, sweepTo), t + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(gain || 0.5, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t);
  },
  move()   { this.tone(180, 0.05, 'square', 0.07); },
  rot()    { this.tone(340, 0.06, 'triangle', 0.1); },
  land()   { this.tone(120, 0.09, 'square', 0.12, 70); },
  hard()   { this.tone(90, 0.12, 'sawtooth', 0.14, 50); this.noise(0.1, 0.25, 900, 200); },
  clear(n) { const base = 440;                         // 지운 줄 수만큼 음이 올라간다
             for (let i = 0; i < n + 1; i++) setTimeout(() => this.tone(base * Math.pow(1.26, i), 0.13, 'triangle', 0.16), i * 70); },
  fire()   { this.tone(900, 0.22, 'sawtooth', 0.13, 120); },
  /* 💥 대형 폭발 — 한 방으로 끝내지 않고 네 겹으로 쌓는다:
     ① 때리는 순간의 날카로운 크랙 ② 몸통이 되는 저음이 뚝 떨어지는 소리
     ③ 넓게 퍼지는 노이즈 ④ 잔해가 흩어지는 꼬리. 파일 없이 전부 합성한다. */
  boom(big) {
    if (!this.on || !this.ctx) return;
    if (!big) { this.noise(0.25, 0.42, 1100, 90); this.tone(120, 0.2, 'square', 0.14, 45); return; }
    const t = this.ctx.currentTime;
    this.noise(0.06, 0.85, 8000, 3000);                       // ① 크랙
    // ② 서브베이스 — 90Hz 에서 25Hz 로 뚝 떨어지며 배를 울린다
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(110, t);
    o.frequency.exponentialRampToValueAtTime(26, t + 0.85);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.95, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + 1.2);
    // ③ 몸통 노이즈 — 넓게 퍼졌다가 낮게 잦아든다
    this.noise(0.9, 0.95, 4200, 70);
    setTimeout(() => this.noise(0.7, 0.5, 1600, 60), 90);
    // ④ 잔해 — 사방으로 흩어지는 꼬리
    for (let i = 0; i < 10; i++)
      setTimeout(() => this.noise(0.12, 0.22, 900 + Math.random() * 3500, 200), 160 + i * 70 + Math.random() * 60);
  },
  /* 바스러짐 — 한 줄을 한 번에 '퍽' 하고 끝내지 않고, 블록 한 칸마다 소리를 내서
     조각이 다 떨어질 때까지 자글자글 이어지게 한다. cols·rows 만큼 촘촘해진다. */
  crumble(rows, cols) {
    if (!this.on || !this.ctx) return;
    const R = Math.max(1, rows || 1), C = cols || 10;
    this.noise(0.16, 0.5, 3000, 700);                          // 갈라지는 첫 소리
    this.tone(150, 0.18, 'square', 0.18, 60);
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {   // 블록 한 칸마다 — 왼쪽부터 차례로
      const at = c * 45 + r * 24 + Math.random() * 25;          // 파편이 부서지는 순서와 같은 간격
      setTimeout(() => {
        this.noise(0.07, 0.30, 1800 + Math.random() * 4200, 400);
        if (Math.random() < 0.4) this.tone(300 + Math.random() * 900, 0.05, 'triangle', 0.07);
      }, at);
    }
    for (let i = 0; i < 8; i++)                                  // 다 떨어질 때까지 이어지는 잔조각
      setTimeout(() => this.noise(0.1, 0.16, 700 + Math.random() * 2200, 250), C * 45 + i * 90);
    setTimeout(() => this.noise(0.7, 0.22, 600, 120), 120);      // 아래로 쏟아지는 잔향
  },
  combo(c) {                                   // 콤보가 쌓일수록 음이 올라가고 소리가 두꺼워진다
    if (!this.on || !this.ctx) return;
    const step = Math.min(c, 8);
    const base = 440 * Math.pow(1.12, step);
    this.tone(base, 0.16, 'triangle', 0.18 + step * 0.02);
    setTimeout(() => this.tone(base * 1.5, 0.16, 'square', 0.09 + step * 0.012), 80);
    if (step >= 3) setTimeout(() => this.tone(base * 2, 0.22, 'sine', 0.12), 150);
    if (step >= 5) this.noise(0.2, 0.25, 5200, 900);
  },
  tetris() {                                    // 4줄 — 팡파르 + 큰 폭발 + 반짝임
    if (!this.on || !this.ctx) return;
    this.boom(true);
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) =>
      setTimeout(() => { this.tone(f, 0.5, 'triangle', 0.3); this.tone(f * 2, 0.3, 'square', 0.09); }, i * 85));
    setTimeout(() => { this.tone(1046.5, 0.9, 'triangle', 0.26); this.tone(1568, 0.9, 'sine', 0.16); }, 470);
    for (let i = 0; i < 12; i++)
      setTimeout(() => this.tone(1800 + Math.random() * 2600, 0.09, 'sine', 0.06), 300 + i * 70);
  },
  levelUp(){ [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 0.12, 'triangle', 0.15), i * 60)); },
  over()   { [440, 392, 330, 262, 196].forEach((f, i) => setTimeout(() => this.tone(f, 0.28, 'sawtooth', 0.16), i * 130)); },
  /* 배경음 — 8분음표 격자에 베이스와 아르페지오를 얹은 짧은 루프. 레벨이 오르면 빨라진다. */
  startMusic() {
    const BASS = [55, 55, 73.42, 73.42, 65.41, 65.41, 82.41, 82.41];              // A1 A1 D2 D2 C2 C2 E2 E2
    const ARP  = [440, 523.25, 659.25, 523.25, 587.33, 698.46, 880, 698.46,
                  392, 523.25, 659.25, 523.25, 659.25, 830.61, 987.77, 830.61];
    const tick = () => {
      if (!this.on || !this.ctx || !this.musicOn) return;
      const s = this.step++;
      const beat = 0.5 - Math.min(0.18, (window.level || 1) * 0.012);              // 레벨↑ = 템포↑
      if (s % 2 === 0) this.tone(BASS[(s / 2) % BASS.length], beat * 1.7, 'triangle', 0.11);
      this.tone(ARP[s % ARP.length], beat * 0.7, 'square', 0.045);
      if (s % 8 === 0) this.noise(0.05, 0.09, 4000);                               // 하이햇 느낌
      this.timer = setTimeout(tick, beat * 1000);
    };
    this.musicOn = true; this.step = 0; clearTimeout(this.timer); tick();
  },
  toggle() {
    // 곡 파일도 같이 멈추고/재생 (합성음만 끄면 노래가 계속 나온다)
    setTimeout(() => { if (bgmEl) { if (this.on) bgmEl.play().catch(() => {}); else bgmEl.pause(); } }, 0);
    this.on = !this.on;
    if (this.on) { this.init(); this.musicOn = true; this.startMusic(); }
    else { this.musicOn = false; clearTimeout(this.timer); }
    return this.on;
  },
};

/* ─────────── 조각 ─────────── */
const SHAPES = {
  I: { c:'#22d3ee', m:[[1,1,1,1]] },
  O: { c:'#fde047', m:[[1,1],[1,1]] },
  T: { c:'#c084fc', m:[[0,1,0],[1,1,1]] },
  S: { c:'#4ade80', m:[[0,1,1],[1,1,0]] },
  Z: { c:'#fb7185', m:[[1,1,0],[0,1,1]] },
  J: { c:'#60a5fa', m:[[1,0,0],[1,1,1]] },
  L: { c:'#fb923c', m:[[0,0,1],[1,1,1]] },
};
const KEYS = Object.keys(SHAPES);
// 칸 값: 1=보통 2=◆(미사일) 3=★(대형미사일)
let board, cur, next, score, lines, level, ammo1, ammo2, over, paused;
let gravity, acc, last, missiles, shards, shake, hardSlide, softDrop;
let flash = 0, banner = 0, sparks = [];   // 4줄 완성 연출 — 화면 번쩍임 · 배너 · 불꽃
let combo = 0, comboShow = 0;              // 연속으로 줄을 지운 횟수 (한 번이라도 못 지우면 0)
let undoLeft = 3, undoStack = [];          // 무르기 — 방금 놓은 블록을 되돌린다

function blank() { return Array.from({ length: ROWS }, () => Array(COLS).fill(null)); }
function newPiece() {
  const k = KEYS[(Math.random() * KEYS.length) | 0];
  const m = SHAPES[k].m.map(r => r.slice());
  const cells = [];
  m.forEach((row, y) => row.forEach((v, x) => { if (v) cells.push([y, x]); }));
  const r = Math.random();
  if (r < 0.06) { const [y, x] = cells[(Math.random() * cells.length) | 0]; m[y][x] = 3; }       // ★ 대형
  else if (r < 0.22) { const [y, x] = cells[(Math.random() * cells.length) | 0]; m[y][x] = 2; }  // ◆ 일반
  return { k, m, c: SHAPES[k].c, x: ((COLS - m[0].length) / 2) | 0, y: 0 };
}
function collide(p, dx, dy, mm) {
  const m = mm || p.m;
  for (let y = 0; y < m.length; y++) for (let x = 0; x < m[y].length; x++) {
    if (!m[y][x]) continue;
    const px = p.x + x + dx, py = p.y + y + dy;
    if (px < 0 || px >= COLS || py >= ROWS) return true;
    if (py >= 0 && board[py][px]) return true;
  }
  return false;
}
function rotate(m) {
  const h = m.length, w = m[0].length;
  const out = Array.from({ length: w }, () => Array(h).fill(0));
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) out[x][h - 1 - y] = m[y][x];
  return out;
}
function tryRotate() {                       // 벽에 붙어 있으면 한 칸 밀어서라도 돌려 준다
  const r = rotate(cur.m);
  for (const dx of [0, -1, 1, -2, 2]) if (!collide(cur, dx, 0, r)) { cur.m = r; cur.x += dx; Snd.rot(); return; }
}

/* ─────────── 부서지는 조각 ───────────
   줄이 지워질 때 블록을 그대로 없애지 않고, 한 칸을 작은 파편 4개로 쪼개
   왼쪽부터 차례로 튀어오르며 떨어지게 한다 (글자가 조각나 흩어지듯). */
function shatterCell(px, py, color, delay, power, burst) {
  const NX = shatterFine ? 8 : 3, NY = shatterFine ? 4 : 2, qx = CELL / NX, qy = CELL / NY;
  for (let iy = 0; iy < NY; iy++) for (let ix = 0; ix < NX; ix++) {
    // 가운데에서 바깥으로 밀려나듯 — 조각이 제자리에 뭉치지 않고 흩어진다
    const cx = (ix + 0.5) / NX - 0.5, cy = (iy + 0.5) / NY - 0.5;
    shards.push({
      x: px * CELL + ix * qx, y: py * CELL + iy * qy,
      vx: cx * (burst ? (power || 2.2) * 2.2 : 1.6) + (Math.random() - 0.5) * 0.6,
      vy: burst ? (cy * (power || 2.2) * 1.6 - Math.random() * 1.2)
                : (Math.random() * 0.6 + 0.15 + cy * 0.5),
      rot: 0, vr: (Math.random() - 0.5) * (burst ? 0.5 : 0.25),
      w: qx, h: qy, size: qx, color, life: 1, delay: (delay || 0) + iy * 8,
    });
  }
}
// 한 번에 너무 많으면(4줄 동시 삭제 = 640조각) 폰에서 버벅인다 — 오래된 것부터 정리
function capShards() { if (shards.length > 700) shards.splice(0, shards.length - 700); }
let shatterFine = true;                    // 여러 줄을 한 번에 지울 땐 조각을 굵게 (렉 방지)
function shatterRow(y) {
  for (let x = 0; x < COLS; x++) {
    const c = board[y][x];
    if (c) shatterCell(x, y, c.c, x * 45);       // 왼쪽부터 45ms 씩 늦게 = 한 칸씩 차례로 부서짐
  }
  capShards();
}
/* 4줄 연출용 불꽃 — 파편보다 밝고 크게, 사방으로 솟았다 떨어진다 */
const SPARK = ['#fde047', '#f472b6', '#22d3ee', '#a3e635', '#fb923c', '#ffffff'];
function sparkBurst(x, y) {
  for (let i = 0; i < 3; i++) {            // 칸당 3개 (예전 6개는 4줄에서 240개가 한꺼번에 생겼다)
    const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 5;
    sparks.push({ x: x * CELL + CELL / 2, y: y * CELL + CELL / 2,
      vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3.5,
      r: 2 + Math.random() * 3.5, life: 1, color: SPARK[(Math.random() * SPARK.length) | 0] });
  }
}
function stepSparks(dt) {
  const k = dt / 16.7;
  for (const s of sparks) { s.vy += 0.22 * k; s.x += s.vx * k; s.y += s.vy * k; s.life -= dt / 1100; }
  sparks = sparks.filter(s => s.life > 0 && s.y < cv.height + 40);
}

function stepShards(dt) {
  for (const s of shards) {
    if (s.delay > 0) { s.delay -= dt; continue; }
    const k = dt / 16.7;                                   // 60fps 기준 환산 — 주사율이 달라도 같은 속도
    s.vy += 0.16 * k; s.x += s.vx * 1.0 * k; s.y += s.vy * 1.04 * k; s.rot += s.vr * 1.0 * k;   // 지금보다 2배 빠르게
    if (s.y > cv.height) s.life = 0;
    s.life -= dt / 4200;
  }
  shards = shards.filter(s => s.life > 0);
}

/* ─────────── 줄 지우기 ─────────── */
function clearLines() {
  const full = [];
  for (let y = 0; y < ROWS; y++) if (board[y].every(Boolean)) full.push(y);
  if (!full.length) { combo = 0; return; }                   // 한 줄도 못 지우면 콤보 끊김
  let got1 = 0, got2 = 0;
  shatterFine = full.length < 3;           // 3줄 이상이면 조각을 32개 → 6개로 (한 번에 1280개는 폰이 버벅인다)
  for (const y of full) {
    if (board[y].some(c => c && c.item === 2)) got1++;
    if (board[y].some(c => c && c.item === 3)) got2++;
    shatterRow(y);
  }
  for (const y of full) { board.splice(y, 1); board.unshift(Array(COLS).fill(null)); }
  combo++; comboShow = 1;                                   // 연속 삭제 — 쉴 새 없이 지우면 점점 세진다
  score += Math.max(0, combo - 1) * 120 * full.length;       // 콤보 보너스
  lines += full.length;
  score += [0, 100, 300, 500, 800][full.length] || 800;
  /* 🎆 4줄(테트리스) — 여기서만 크게 터뜨린다. 화면이 번쩍이고 불꽃이 솟고 배너가 튀어나온다. */
  if (full.length >= 4) {
    flash = 1; banner = 1; shake = 30; score += 1200;
    for (const y of full) for (let x = 0; x < COLS; x += 2) sparkBurst(x, y);   // 한 칸 걸러 하나씩
    Snd.tetris();
  } else { flash = Math.min(0.7, 0.12 * full.length + combo * 0.06); shake = Math.min(20, 4 * full.length + combo * 2); }
  if (combo >= 2) Snd.combo(combo);                          // 콤보가 쌓일수록 높고 화려한 소리
  ammo1 += got1; ammo2 += got2;
  const nl = Math.floor(lines / 10) + 1;
  if (nl !== level) { level = nl; window.level = level; undoLeft++; Snd.levelUp(); }   // 10줄마다 무르기 한 번 더
  gravity = Math.max(90, 800 - (level - 1) * 70);
  Snd.clear(full.length); Snd.crumble(full.length, COLS);
}

/* ─────────── 미사일 ─────────── */
function fire(big) {
  if (over || paused) return;
  if (big ? !ammo2 : !ammo1) return;
  if (big) ammo2--; else ammo1--;
  const col = Math.min(COLS - 1, Math.max(0, cur.x + ((cur.m[0].length / 2) | 0)));
  missiles.push({ col, y: cur.y + cur.m.length, big: !!big });
  Snd.fire();
}
function explode(row, col, big) {
  const R = big ? 2 : 0;                       // 대형은 반경 2 (5x5 안쪽 원)
  let hit = 0;
  for (let y = row - R; y <= row + R; y++) for (let x = col - R; x <= col + R; x++) {
    if (y < 0 || y >= ROWS || x < 0 || x >= COLS) continue;
    if (big && (y - row) * (y - row) + (x - col) * (x - col) > R * R + 1) continue;
    const c = board[y][x];
    if (!c) continue;
    if (c.item === 2) ammo1++;              // ◆ 를 미사일로 깨도 한 발 돌려받는다
    else if (c.item === 3) ammo2++;         // ★ 도 마찬가지
    shatterCell(x, y, c.c, 0, big ? 5 : 2.6, true);
    board[y][x] = null; hit++;
  }
  score += hit * (big ? 40 : 20);
  if (hit || big) { Snd.boom(big); Snd.crumble(1, Math.max(2, Math.min(hit, 8))); shake = big ? 22 : 6; }
  return hit;
}
function stepMissiles(dt) {
  for (const ms of missiles) {
    if (ms.dead) continue;
    // 초당 몇 칸으로 움직인다 — 프레임당으로 하면 144Hz 화면에서 2배 넘게 빨라진다
    const spd = (ms.big ? 6 : 20) * (dt / 1000);   // 대형은 일반의 1/3 이상 느리게
    const from = ms.y, to = ms.y + spd;
    /* 지나온 줄을 하나도 빠뜨리지 않고 검사한다 — 예전엔 한 번에 1.5칸씩 건너뛰어서
       블록이 있는 줄을 그냥 통과해 버렸다 (= 미사일을 쏴도 아무 일도 안 일어남). */
    for (let r = Math.max(0, Math.ceil(from)); r <= Math.floor(to) && r < ROWS; r++) {
      if (board[r][ms.col]) { explode(r, ms.col, ms.big); ms.dead = true; break; }
    }
    ms.y = to;
  }
  missiles = missiles.filter(m => !m.dead && m.y < ROWS + 1);
}
/* ─────────── 낙하 ─────────── */
function merge(p) {
  p.m.forEach((row, y) => row.forEach((v, x) => {
    if (v && p.y + y >= 0) board[p.y + y][p.x + x] = { c: p.c, item: v };
  }));
}
/* ↩ 무르기 — 방금 놓은 블록을 통째로 되돌린다. 놓기 직전 판을 통째로 찍어 두었다가 복원한다. */
function snapshot() {
  undoStack.push({
    board: board.map(r => r.map(c => (c ? { c: c.c, item: c.item } : null))),
    score, lines, level, ammo1, ammo2, gravity,
    piece: { k: cur.k, m: cur.m.map(r => r.slice()), c: cur.c, x: cur.x, y: cur.y },
    next: { k: next.k, m: next.m.map(r => r.slice()), c: next.c, x: next.x, y: next.y },
  });
  if (undoStack.length > 5) undoStack.shift();
}
function undo() {
  if (over || paused || !undoLeft || !undoStack.length) return;
  const s = undoStack.pop();
  board = s.board; score = s.score; lines = s.lines; level = s.level;
  ammo1 = s.ammo1; ammo2 = s.ammo2; gravity = s.gravity;
  cur = s.piece; next = s.next;
  undoLeft--; acc = 0; hardSlide = 0; combo = 0;
  shards = []; sparks = [];
  Snd.tone(520, 0.12, 'triangle', 0.16, 300); Snd.tone(300, 0.14, 'square', 0.1, 520);
}
function lock() { snapshot(); merge(cur); Snd.land(); clearLines(); spawn(); }
function spawn() {
  cur = next || newPiece(); next = newPiece(); acc = 0; hardSlide = 0;
  if (collide(cur, 0, 0)) {
    over = true; Snd.over();
    document.getElementById('over').classList.add('on');
    document.getElementById('final').textContent = '점수 ' + score + ' · ' + lines + '줄 · Lv' + level;
  }
}
function stepDown() { if (collide(cur, 0, 1)) lock(); else cur.y++; }
function hardDrop() {                                  // 즉시가 아니라 '아주 빠르게 미끄러져' 내려간다
  if (hardSlide) return;
  hardSlide = 1; Snd.hard();
}

/* ─────────── 그리기 ─────────── */
function cellBox(g, px, py, color, item, size) {
  const s = size || CELL;
  g.fillStyle = color; g.fillRect(px + 1, py + 1, s - 2, s - 2);
  g.fillStyle = 'rgba(255,255,255,.20)'; g.fillRect(px + 1, py + 1, s - 2, Math.max(3, s * 0.13));
  g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(px + 1, py + s - 5, s - 2, 4);
  if (item === 2 || item === 3) {
    g.fillStyle = item === 3 ? '#7f1d1d' : '#0b1220';
    g.font = 'bold ' + Math.round(s * 0.55) + 'px sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(item === 3 ? '★' : '◆', px + s / 2, py + s / 2 + 1);
  }
}
function draw(sub) {
  ctx.save();
  if (shake > 0) { ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake); }
  ctx.fillStyle = '#0f172a'; ctx.fillRect(-20, -20, cv.width + 40, cv.height + 40);
  ctx.strokeStyle = 'rgba(148,163,184,.08)'; ctx.lineWidth = 1;
  for (let x = 1; x < COLS; x++) { ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, cv.height); ctx.stroke(); }
  for (let y = 1; y < ROWS; y++) { ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(cv.width, y * CELL); ctx.stroke(); }
  board.forEach((row, y) => row.forEach((c, x) => { if (c) cellBox(ctx, x * CELL, y * CELL, c.c, c.item); }));
  if (cur && !over) {
    let gy = 0; while (!collide(cur, 0, gy + 1)) gy++;
    ctx.globalAlpha = .18;                                   // 착지 위치 미리보기
    cur.m.forEach((row, y) => row.forEach((v, x) => { if (v) cellBox(ctx, (cur.x + x) * CELL, (cur.y + y + gy) * CELL, cur.c, 0); }));
    ctx.globalAlpha = 1;
    const off = sub * CELL;                                  // 칸 사이를 부드럽게 (뚝뚝 끊기지 않게)
    cur.m.forEach((row, y) => row.forEach((v, x) => { if (v) cellBox(ctx, (cur.x + x) * CELL, (cur.y + y) * CELL + off, cur.c, v); }));
  }
  for (const ms of missiles) {                               // 🚀 / 💥
    const cx = ms.col * CELL + CELL / 2, cy = ms.y * CELL, w = ms.big ? 11 : 6;
    ctx.fillStyle = ms.big ? 'rgba(244,63,94,.35)' : 'rgba(251,146,60,.30)';
    ctx.fillRect(cx - w / 2, cy - 30, w, 26);
    ctx.fillStyle = ms.big ? '#f43f5e' : '#fb923c';
    ctx.beginPath(); ctx.moveTo(cx, cy + (ms.big ? 18 : 12));
    ctx.lineTo(cx - w, cy - 8); ctx.lineTo(cx + w, cy - 8); ctx.closePath(); ctx.fill();
  }
  for (const s of shards) {                                  // 부서진 파편
    if (s.delay > 0) continue;
    ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, s.life));
    ctx.translate(s.x + (s.w || s.size) / 2, s.y + (s.h || s.size) / 2); ctx.rotate(s.rot);
    ctx.fillStyle = s.color; ctx.fillRect(-(s.w || s.size) / 2, -(s.h || s.size) / 2, (s.w || s.size) - 0.5, (s.h || s.size) - 0.5);
  for (const s of sparks) {                                 // 🎆 불꽃
    ctx.globalAlpha = Math.max(0, Math.min(1, s.life));
    ctx.fillStyle = s.color;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r * (0.4 + s.life * 0.9), 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }
  if (flash > 0) {                                          // 화면 번쩍임
    ctx.fillStyle = 'rgba(255,255,255,' + (flash * 0.5).toFixed(3) + ')';
    ctx.fillRect(0, 0, cv.width, cv.height);
  }
  if (comboShow > 0 && combo >= 2) {                        // 🔥 콤보 표시
    ctx.save();
    ctx.globalAlpha = Math.min(1, comboShow * 1.6);
    ctx.translate(cv.width / 2, cv.height * 0.22);
    const sc = 1 + (1 - comboShow) * 0.5 + Math.min(combo, 8) * 0.05;
    ctx.scale(sc, sc);
    ctx.font = '900 30px Pretendard, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(2,6,23,.8)';
    const txt = combo + ' COMBO';
    ctx.strokeText(txt, 0, 0);
    ctx.fillStyle = combo >= 5 ? '#f43f5e' : (combo >= 3 ? '#fb923c' : '#fde047');
    ctx.fillText(txt, 0, 0);
    ctx.restore(); ctx.globalAlpha = 1;
  }
  if (banner > 0) {                                         // 가운데 배너 — 튀어나왔다 사라진다
    const p = 1 - banner, sc = 0.6 + Math.min(1, p * 4) * 0.55 + p * 0.25;
    ctx.save();
    ctx.translate(cv.width / 2, cv.height * 0.42); ctx.scale(sc, sc);
    ctx.globalAlpha = Math.min(1, banner * 2.2);
    const grd = ctx.createLinearGradient(-130, 0, 130, 0);
    grd.addColorStop(0, '#fde047'); grd.addColorStop(0.5, '#f472b6'); grd.addColorStop(1, '#22d3ee');
    ctx.font = '900 46px Pretendard, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(2,6,23,.85)'; ctx.strokeText('TETRIS!', 0, 0);
    ctx.fillStyle = grd; ctx.fillText('TETRIS!', 0, 0);
    ctx.font = '800 15px Pretendard, sans-serif'; ctx.fillStyle = '#e5e7eb';
    ctx.fillText('+1200', 0, 38);
    ctx.restore(); ctx.globalAlpha = 1;
  }
    ctx.restore();
  }
  ctx.restore();

  nctx.clearRect(0, 0, nx.width, nx.height);
  if (next) {
    const w = next.m[0].length, h = next.m.length, s = 24;
    const ox = (nx.width - w * s) / 2, oy = (nx.height - h * s) / 2;
    next.m.forEach((row, y) => row.forEach((v, x) => { if (v) cellBox(nctx, ox + x * s, oy + y * s, next.c, v, s); }));
  }
  document.getElementById('score').textContent = score;
  document.getElementById('lines').textContent = lines;
  document.getElementById('level').textContent = level;
  document.getElementById('ammo1').textContent = ammo1;
  document.getElementById('ammo2').textContent = ammo2;
  {  // 상단 좌측의 작은 '다음 블록'
    const hn = document.getElementById('hNx'), hc = hn.getContext('2d');
    hc.clearRect(0, 0, hn.width, hn.height);
    if (next) {
      const w = next.m[0].length, h2 = next.m.length, s = Math.min(8, (hn.width - 4) / w, (hn.height - 4) / h2);
      const ox = (hn.width - w * s) / 2, oy = (hn.height - h2 * s) / 2;
      next.m.forEach((row, y) => row.forEach((v, x) => {
        if (!v) return;
        hc.fillStyle = next.c; hc.fillRect(ox + x * s, oy + y * s, s - 1, s - 1);
        if (v === 2 || v === 3) { hc.fillStyle = v === 3 ? '#7f1d1d' : '#0b1220';
          hc.fillRect(ox + x * s + s * 0.3, oy + y * s + s * 0.3, s * 0.4, s * 0.4); }
      }));
    }
  }
  document.getElementById('hScore').textContent = score;
  document.getElementById('hLines').textContent = lines;
  document.getElementById('hLevel').textContent = level;
  document.getElementById('a1').textContent = ammo1;
  document.getElementById('a2').textContent = ammo2;
  document.getElementById('au').textContent = undoLeft;
}

/* ─────────── 루프 ─────────── */
function loop(t) {
  if (!last) last = t;
  const dt = Math.min(50, t - last); last = t;
  let sub = 0;
  if (!over && !paused) {
    if (hardSlide) {                                   // 즉시낙하 — 6ms 마다 한 칸씩 주르륵
      hardSlide += dt;
      while (hardSlide > 6) { if (collide(cur, 0, 1)) { hardSlide = 0; lock(); break; } cur.y++; score += 1; hardSlide -= 6; }
      if (hardSlide) hardSlide = Math.max(1, hardSlide);
    } else {
      const g = softDrop ? 45 : gravity;               // ↓ 누르는 동안은 아주 빠르게, 대신 부드럽게
      acc += dt;
      let guard = 0;
      while (acc >= g && guard++ < 2) { acc -= g; if (softDrop) score += 1; stepDown(); if (over) break; }
      if (acc > g) acc = g;                    // 탭 전환 등으로 시간이 크게 밀렸어도 몰아서 떨어뜨리지 않는다
      if (cur && !collide(cur, 0, 1)) sub = Math.min(0.999, acc / g);
    }
    if (missiles.length) stepMissiles(dt);
  }
  if (shards.length) stepShards(dt);
  if (sparks.length) stepSparks(dt);
  if (flash > 0) flash = Math.max(0, flash - dt / 420);
  if (banner > 0) banner = Math.max(0, banner - dt / 1400);
  if (comboShow > 0) comboShow = Math.max(0, comboShow - dt / 900);
  if (shake > 0) shake = Math.max(0, shake - dt * 0.06);
  draw(sub);
  requestAnimationFrame(loop);
}

/* ─────────── 조작 ─────────── */
const act = {
  left:  () => { if (!collide(cur, -1, 0)) { cur.x--; Snd.move(); } },
  right: () => { if (!collide(cur, 1, 0)) { cur.x++; Snd.move(); } },
  rot:   () => tryRotate(),
  soft:  on => {                       // 느린 낙하 도중 눌러도 '그동안 쌓인 시간' 이 한꺼번에 소비되지 않게
    if (on && !softDrop) acc = Math.min(acc, 45);
    softDrop = on;
  },
  hard:  () => hardDrop(),
  fire:  () => fire(false),
  boom:  () => fire(true),
};
addEventListener('keydown', e => {
  Snd.init();
  const k = e.key.toLowerCase();
  if (k === 'm') { document.getElementById('mute').textContent = Snd.toggle() ? '🔊 소리 켜짐' : '🔇 소리 꺼짐'; return; }
  if (over) { if (e.code === 'Space' || k === 'enter') reset(); return; }
  if (k === 'p') { paused = !paused; return; }
  if (paused) return;
  if (e.key === 'ArrowLeft') act.left();
  else if (e.key === 'ArrowRight') act.right();
  else if (e.key === 'ArrowDown') act.soft(true);
  else if (e.key === 'ArrowUp') act.rot();
  else if (e.code === 'Space') act.hard();
  else if (k === 'f') { if (!e.repeat) act.fire(); }        // 꾹 눌러도 한 발만
  else if (k === 'g') { if (!e.repeat) act.boom(); }
  else if (k === 'z') { if (!e.repeat) undo(); }
  else return;
  e.preventDefault();
});
addEventListener('keyup', e => { if (e.key === 'ArrowDown') act.soft(false); });

const hold = (id, fn, repeat, upFn) => {                 // 📱 버튼 — 꾹 누르면 반복
  const el = document.getElementById(id); if (!el) return;
  let t = null, iv = null;
  const go = ev => { ev.preventDefault(); Snd.init(); if (over || paused) return; fn();
    if (repeat) { t = setTimeout(() => { iv = setInterval(() => { if (!over && !paused) fn(); }, 80); }, 240); } };
  const stop = () => { clearTimeout(t); clearInterval(iv); t = iv = null; if (upFn) upFn(); };
  // 포인터 이벤트 하나로만 받는다 — touchstart 와 mousedown 을 같이 달면 한 번 눌러도 두 번 실행됐다
  el.addEventListener('pointerdown', go);
  ['pointerup','pointercancel','pointerleave'].forEach(e => el.addEventListener(e, stop));
};
hold('bL', act.left, true); hold('bR', act.right, true); hold('bRot', act.rot, false);
hold('bDown', () => act.soft(true), false, () => act.soft(false));
hold('bDrop', act.hard, false); hold('bFire', act.fire, false); hold('bBoom', act.boom, false); hold('bUndo', () => undo(), false);

(() => {                                                  // 📱 판 위 스와이프
  let sx = 0, sy = 0, st = 0, moved = 0;
  cv.addEventListener('touchstart', e => { Snd.init(); const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); moved = 0; }, { passive: true });
  cv.addEventListener('touchmove', e => {
    if (over || paused) return;
    const t = e.touches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    const step = cv.getBoundingClientRect().width / COLS;
    if (Math.abs(dx) > step && Math.abs(dx) > Math.abs(dy)) { act[dx > 0 ? 'right' : 'left'](); sx = t.clientX; moved++; }
    else if (dy > step * 0.8) { act.soft(true); setTimeout(() => act.soft(false), 220); sy = t.clientY; moved++; }
    e.preventDefault();
  }, { passive: false });
  cv.addEventListener('touchend', e => {
    if (over) { reset(); return; }
    if (paused) return;
    const dt = Date.now() - st, dy = e.changedTouches[0].clientY - sy;
    if (!moved && dt < 250) act.rot();
    else if (dy > cv.getBoundingClientRect().height * 0.28) act.hard();
  }, { passive: true });
})();

/* 🎵 배경음 — 직접 만든 합성음(기본) 과 실제 곡 3개 중에서 고른다.
   곡은 mp3 파일로 옆에 두고 필요할 때만 받아온다(첫 로딩을 무겁게 하지 않으려고). */
const TRACKS = [
  { id: 'synth', name: '합성음' },
  { id: 'm1', name: '노래 1', src: 'bgm1.mp3' },
  { id: 'm2', name: '노래 2', src: 'bgm2.mp3' },
  { id: 'm3', name: '노래 3', src: 'bgm3.mp3' },
];
let bgmIdx = 0, bgmEl = null;
try { bgmIdx = Math.max(0, Math.min(TRACKS.length - 1, +localStorage.getItem('mt_bgm') || 0)); } catch (e) {}
function applyBgm() {
  const t = TRACKS[bgmIdx];
  try { localStorage.setItem('mt_bgm', String(bgmIdx)); } catch (e) {}
  const label = '♪ ' + t.name;
  const b1 = document.getElementById('bgmBtn'), b2 = document.getElementById('bgmBtn2');
  if (b1) b1.textContent = label;
  if (b2) b2.textContent = label + ' 바꾸기';
  if (t.src) {                                  // 실제 곡 — 합성음은 끄고 파일을 반복 재생
    Snd.musicOn = false; clearTimeout(Snd.timer);
    if (!bgmEl) { bgmEl = new Audio(); bgmEl.loop = true; bgmEl.volume = 0.42; }
    if (!bgmEl.src.endsWith(t.src)) bgmEl.src = t.src;
    if (Snd.on) bgmEl.play().catch(() => {});
  } else {                                      // 합성음으로 되돌리기
    if (bgmEl) { bgmEl.pause(); }
    if (Snd.on) { Snd.musicOn = true; Snd.startMusic(); }
  }
}
const nextBgm = () => { Snd.init(); bgmIdx = (bgmIdx + 1) % TRACKS.length; applyBgm(); };

function reset() {
  board = blank(); score = 0; lines = 0; level = 1; window.level = 1;
  ammo1 = 3; ammo2 = 1; undoLeft = 3; undoStack = []; combo = 0; comboShow = 0;   /* 기본 지급 */ over = false; paused = false;
  gravity = 800; acc = 0; last = 0; missiles = []; shards = []; sparks = []; flash = 0; banner = 0; shake = 0; hardSlide = 0; softDrop = false;
  next = null; spawn();
  document.getElementById('over').classList.remove('on');
}
const newGame = () => { Snd.init(); reset(); };
document.getElementById('again').onclick = newGame;
document.getElementById('againM').onclick = newGame;
document.getElementById('muteM').onclick = () => {
  Snd.init();
  const on = Snd.toggle();
  document.getElementById('muteM').textContent = on ? '🔊' : '🔇';
  document.getElementById('mute').textContent = on ? '🔊 소리 켜짐' : '🔇 소리 꺼짐';
};
document.getElementById('restart').onclick = () => { Snd.init(); reset(); };
document.getElementById('mute').onclick = () => {
  Snd.init();
  document.getElementById('mute').textContent = Snd.toggle() ? '🔊 소리 켜짐' : '🔇 소리 꺼짐';
};
reset();
// 길게 누르면 나오는 메뉴(우클릭/롱프레스)도 조작 영역에서는 막는다
[...document.querySelectorAll('.pad button, .hud button, .stage, canvas')].forEach(el => {
  el.addEventListener('contextmenu', e => e.preventDefault());
  el.addEventListener('selectstart', e => e.preventDefault());
});
document.getElementById('bgmBtn').onclick = nextBgm;
document.getElementById('bgmBtn2').onclick = nextBgm;
applyBgm();
const startEl = document.getElementById('start');
const startGame = () => {                       // 첫 탭 — 여기서 소리·배경음을 깨운다
  Snd.init(); applyBgm();
  if (bgmEl && Snd.on) bgmEl.play().catch(() => {});
  startEl.classList.add('off');
  reset();
};
document.getElementById('startBtn').onclick = startGame;
startEl.addEventListener('pointerdown', e => { if (e.target.id !== 'startBtn') startGame(); });
requestAnimationFrame(loop);
</script></body></html>
